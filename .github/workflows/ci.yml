name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # Every local file the built page links to must exist, srcset entries
      # and stylesheet url()s included.
      - name: Check local links
        run: |
          missing=0
          refs=$(grep -oE '(src|href)="/[^"#]*"' dist/index.html | sed -E 's/^(src|href)="\/(.*)"$/\2/'
                 grep -oE 'srcset="[^"]*"' dist/index.html | grep -oE '/[^ ",]+' | sed 's/^\///'
                 cat dist/_astro/*.css | grep -oE 'url\("?/[^")]*"?\)' | sed -E 's/^url\("?\///; s/"?\)$//')
          for ref in $(echo "$refs" | sort -u); do
            [ -z "$ref" ] && continue
            if [ ! -f "dist/$ref" ]; then echo "missing: $ref"; missing=1; fi
          done
          exit $missing

  # The server pulls :main itself (deploy/README.md), so pushing it is the deploy.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One at a time, so an older run can't overwrite a newer image.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cydoentis/maitty-site:main
            ghcr.io/cydoentis/maitty-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
